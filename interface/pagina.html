<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcrição de vídeo em Markdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Roda ANTES da página ser pintada, para não piscar o tema errado ao abrir. -->
<script>
(function () {
  try {
    var salvo = localStorage.getItem('tema');
    var escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
    if (escuro) document.documentElement.classList.add('dark');
  } catch (_) {}
})();
</script>
<style>
<!--ESTILO-->
</style>
</head>
<body>

<!-- Ícones: definidos uma vez aqui e usados com <use href="#i-nome"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
  <symbol id="i-lua" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-baixo" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M12 12H3M16 6H3M12 18H3"/><path d="m16 12 5 3-5 3v-6Z"/></symbol>
  <symbol id="i-relogio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-entrar" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></symbol>
  <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-arquivo" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></symbol>
</svg>

<main class="app">
  <header class="topo">
    <div>
      <h1>Transcrição de vídeo em Markdown</h1>
      <p class="lede">Cole o link de um vídeo ou playlist do YouTube, um por linha. Tudo roda na sua máquina.</p>
    </div>
    <button type="button" class="tema-btn" id="tema" aria-label="Mudar para tema escuro">
      <svg class="ic sol" aria-hidden="true"><use href="#i-sol"/></svg>
      <svg class="ic lua" aria-hidden="true"><use href="#i-lua"/></svg>
    </button>
  </header>

  <!--AVISO-->

  <section class="composer">
    <textarea id="urls" rows="1" spellcheck="false" aria-label="Links do YouTube"
      placeholder="https://www.youtube.com/watch?v=... ou https://www.youtube.com/playlist?list=..."></textarea>
    <div class="composer-rodape">
      <div class="chips" id="langs" role="group" aria-label="Idioma da legenda">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" data-lang="auto" aria-pressed="false">Qualquer</button>
      </div>
      <button type="button" class="btn primary grande" id="go">
        Gerar Markdown <svg class="ic" aria-hidden="true"><use href="#i-seta"/></svg>
      </button>
    </div>
    <div class="progresso" id="progresso"><i></i></div>
  </section>

  <details class="opcoes">
    <summary>
      <svg class="ic" aria-hidden="true"><use href="#i-ajustes"/></svg>
      Opções
      <svg class="ic seta" aria-hidden="true"><use href="#i-baixo"/></svg>
    </summary>
    <div class="opcoes-grade">
      <div class="field">
        <label class="field-label" for="cookies">Cookies</label>
        <select class="picker" id="cookies" title="Empresta a sessão logada quando o YouTube esconde a legenda">
          <option value="">nenhum</option>
          <!--COOKIES_ARQUIVO-->
          <option value="chrome">chrome</option>
          <option value="firefox">firefox</option>
          <option value="edge">edge</option>
          <option value="brave">brave</option>
          <option value="opera">opera</option>
          <option value="safari">safari</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="pausa">Pausa entre vídeos</label>
        <select class="picker" id="pausa" title="Espera entre um vídeo e outro da fila, para o YouTube não bloquear o seu IP">
          <option value="0">nenhuma</option>
          <option value="3">3 s</option>
          <option value="6" selected>6 s</option>
          <option value="10">10 s</option>
          <option value="20">20 s</option>
        </select>
      </div>
      <label class="switch">
        <input type="checkbox" id="ts" checked>
        <span class="track"></span>
        <span>Marcar tempos</span>
      </label>
      <div class="whisper-row"><!--WHISPER--></div>
    </div>
  </details>

  <section class="conta" aria-label="Conta do YouTube">
    <div class="conta-topo">
      <h2 class="secao-titulo">Minha conta</h2>
      <div class="conta-acoes">
        <button type="button" class="btn" id="conta-entrar" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-entrar"/></svg> Entrar com Google
        </button>
        <button type="button" class="btn ghost" id="conta-sair" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-sair"/></svg> Sair
        </button>
      </div>
    </div>
    <p class="conta-msg" id="conta-msg">verificando...</p>

    <!-- Listas que a API do Google não entrega: só o cookies.txt alcança. Ficam sempre visíveis. -->
    <div class="cartoes" id="fixas" role="group" aria-label="Listas que usam cookies">
      <button type="button" class="cartao" data-url="https://www.youtube.com/playlist?list=WL"
        data-cookies="1" aria-pressed="false">
        <span class="ic-caixa"><svg class="ic" aria-hidden="true"><use href="#i-relogio"/></svg></span>
        <span class="titulo">Assistir mais tarde</span>
        <span class="info">usa o cookies.txt</span>
        <svg class="ic marca" aria-hidden="true"><use href="#i-check"/></svg>
      </button>
    </div>
    <div class="cartoes" id="playlists" role="group" aria-label="Minhas playlists"></div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <div class="seletor" id="seletor" hidden></div>
  <div class="bulk" id="bulk"></div>
  <div class="results" id="results"></div>

  <div class="empty" id="empty">
    <svg class="ic" aria-hidden="true"><use href="#i-arquivo"/></svg>
    <p>Nada aqui ainda. Cole um link acima para começar.</p>
  </div>

  <footer>
    <span>servidor local · 127.0.0.1</span>
    <span>legenda → markdown · v3.0</span>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
<!--SCRIPT-->
</script>
</body>
</html>
